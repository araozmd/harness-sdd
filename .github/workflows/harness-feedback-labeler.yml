name: harness-feedback labeler

# E32-F04 — labels issues that carry F02's `harness-feedback:v1` body marker.
# The marker is the ONLY classification input (ADR-0006); every other byte of the issue
# body is untrusted data and reaches the parser only as a file written from the opened-event
# payload snapshot (a run with no event payload falls back to an API fetch).
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Label marker-carrying issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: sh .github/scripts/feedback-labeler.sh label-issue "$ISSUE_NUMBER"
