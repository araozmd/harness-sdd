# harness-sdd configuration
# The agents read this once (after init.sh) to learn HOW to read/write state.
# Swapping a backend value changes where memory lives WITHOUT changing any prompt.

store:
  # TaskStore: high-level epic/feature/task state the Orchestrator reads.
  #   local    -> state/tasks.json            (default, zero deps)
  #   obsidian -> specs/ markdown frontmatter (graph view, backlinks)
  #   jira     -> Atlassian via MCP           (STUBBED — see store/jira.md)
  tasks: local

  # DocStore: the externalized memory — specs, progress, history.
  #   local    -> markdown files in specs/ and progress/
  #   obsidian -> same files, Obsidian-flavored (wikilinks + frontmatter)
  docs: local

  # Post-write sync hook (optional, VCS/PM-neutral). When NON-EMPTY, the Orchestrator
  # runs this command once AFTER any persisted store write (set_status, set_slice_status,
  # write_spec, done rollup), invoked as:  <cmd> "<feature-id>" "<op>"  with cwd = HARNESS_DIR.
  # Best-effort: a non-zero exit NEVER rolls back tasks.json and never blocks the loop — it
  # is reported as a sync gap. Empty (default) ⇒ no hook (today's behavior). The harness never
  # learns what the command does — a git push, a board mirror, both, or nothing. A team might
  # point it at `node tools/sync-board.mjs` (see mirror: below) or a push+mirror wrapper.
  on_write_command: ""

workflow:
  # Human-in-the-loop gate. When true, a feature pauses at `spec-ready` until a
  # human moves it to `in-progress`. Individual tasks can opt out via `sdd: false`
  # or `autonomous: true` in their frontmatter / TaskStore entry.
  require_spec_approval: true

  # Context hygiene: agents should reset context when their window passes this
  # fraction full, handing off via progress/ files. Degradation starts ~0.20.
  context_reset_threshold: 0.40

execution:
  # The harness's single extension point for plugging in an EXTERNAL executor
  # without forking any agent role file. Scope is structural: only roles listed
  # here can be delegated, and only the Builder is delegatable today.
  #
  # The Orchestrator is deliberately NOT a key and never will be — it is the loop
  # that reads this config and invokes delegate_cmd, so it always runs in the host
  # code-agent. Architect / Reviewer / Scout also always run in-session. To make a
  # new role delegatable later, add a sibling key here (e.g. `architect:`).
  builder:
    #   in-session -> the Builder agent implements the code itself, in this CLI
    #                 session (DEFAULT). Works with ANY single coding agent and
    #                 adds zero dependencies — this is what keeps the harness
    #                 universal for engineers who run only one CLI.
    #   delegate   -> the Builder does NOT write code; it shells out to
    #                 `delegate_cmd`, which owns implementation (and may own PR
    #                 creation/review too). Opt in only when an executor is wired.
    backend: in-session

    # Read ONLY when backend: delegate. The Builder invokes it as:
    #     <delegate_cmd> <feature-id> <abs-spec-path>
    # It must exit 0 on success, non-zero to signal failure back to the Builder.
    delegate_cmd: ""

# Telemetry (optional, additive) — best-effort, local-only observability of how long
# each sub-agent runs and how long the human spec-approval gate takes. Safe defaults so
# a target with no `telemetry:` block behaves as if enabled with the default log path.
telemetry:
  # Master kill-switch. false ⇒ the Orchestrator skips telemetry capture entirely.
  # Absence of this whole block ⇒ enabled defaults below.
  enabled: true

  # Writer + report default log path. Resolved UNDER HARNESS_DIR (the value init.sh
  # computes: the repo root in the harness source, .harness/ in an installed consumer)
  # unless given as an absolute path. GITIGNORED / LOCAL-ONLY — never committed (the
  # source .gitignore ignores /telemetry.jsonl; the installer seeds a .harness/.gitignore
  # holding telemetry.jsonl for consumers). The report script accepts --log to override.
  # If you OVERRIDE this to a custom RELATIVE path, the installer ignores it too on its
  # next run — but if you change it post-install without re-running the installer, add
  # the new path to .harness/.gitignore yourself so the log stays out of VCS.
  log: telemetry.jsonl

  # NOTE: token/USD cost accounting is OUT of scope. The `cost` field in each record is a
  # reserved extension slot for a future instrumented SDK runtime and is null today; this
  # harness never populates it.

# Board mirror (optional, opt-in) — a one-way PROJECTION of state/tasks.json onto an
# external project board for human visibility. tasks.json stays the SOURCE OF TRUTH;
# the board is downstream and disposable (agents never read it). Driven by
# tools/sync-board.mjs; see store/board-mirror.md. INERT by default: an empty provider
# means the tool is a no-op. This is a MIRROR, not a store backend (where state lives) —
# see store/README.md "Mirrors vs backends".
mirror:
  board:
    # ""|none disables (default). github-projects is IMPLEMENTED; jira and azure-boards
    # are recognized STUBS (no-op until implemented — see store/board-mirror.md).
    provider: ""

    # github-projects provider config (ignored by other providers):
    owner: ""             # org/user login that owns the Project + the issues repo
    project_number: 0     # the GitHub Project number (e.g. 1)
    repo: ""              # owner/repo that holds the mirrored issues (e.g. my-org/specs)

    # Optional: map harness status -> board COLUMN name. Omit for identity (column ==
    # status). Set this to keep EXISTING board columns without editing sync-board.mjs:
    # status_map:
    #   pending: "Todo"
    #   spec-ready: "Spec ready"
    #   in-progress: "In Progress"
    #   in-review: "In review"
    #   done: "Done"

verification:
  init_script: ./init.sh
  # Commands the Reviewer must run before marking work done. Project-specific —
  # edit these per target repo.
  test_command: "sh tests/test_install.sh && sh tests/test_umbrella.sh && sh tests/test_cascade.sh && sh tests/test_inception.sh && sh tests/test_reviewer.sh && sh tests/test_telemetry.sh && sh tests/test_mirror.sh && sh tests/test_epic_lifecycle.sh"   # installer + umbrella coordinator + cascade + inception intake + reviewer + telemetry + board-mirror + epic lifecycle suites

  lint_command: ""        # e.g. "ruff check ." or "npm run lint"
  typecheck_command: ""   # e.g. "mypy ." or "tsc --noEmit"

  # Umbrella mode only (see docs/UMBRELLA.md): the feature-level integration check
  # that runs the stack together (e.g. "viernes-infra/dev.sh ci"). It runs ONLY when
  # every slice of a cross-repo feature is done+merged, and a non-zero exit keeps the
  # feature out of `done`. Empty ⇒ no integration gate (single-repo default).
  integration_command: ""

# Umbrella coordinator (cross-repo) — ADDITIVE / opt-in. See docs/UMBRELLA.md.
# A single-repo project leaves this inert: with `manifest` unset (or the file
# absent) the coordinator does nothing and the existing single-repo flow
# (init.sh, verification.test_command, Reviewer `done` verdict) is unchanged.
umbrella:
  # Path to the umbrella manifest (see umbrella.manifest.example.yaml). The PRESENCE
  # of this file is the umbrella-mode switch. Unset/absent ⇒ single-repo, inert.
  #
  # Path bases (two, by design): THIS value resolves relative to the harness dir
  # (.harness/, which is init.sh's cwd) — so the cascade installer's default is
  # `../umbrella.manifest.yaml` (the manifest sits at the umbrella root). Inside the
  # manifest, each repo's `path:` resolves relative to the MANIFEST file's own dir,
  # not to .harness/. See docs/UMBRELLA.md → Manifest reference.
  #
  # Dispatch backend is execution.builder.backend above: the default `in-session`
  # drives each slice by spawning the Builder cd'd into the child repo (no executor,
  # no per-repo delegate_cmd needed); `delegate` shells out to each repo's delegate_cmd.
  manifest: ""
